# Respaldo semanal de tu base de datos Supabase, guardado como archivo
# descargable en GitHub (pestaña Actions → Respaldo semanal → Artifacts).
# Requiere el secreto SUPABASE_DB_URL (Supabase → Connect → Session pooler).
# Si el secreto no existe, el flujo se salta sin error.
name: Respaldo semanal

on:
  schedule:
    - cron: '17 9 * * 1' # lunes 06:17 en Chile (horario de verano)
  workflow_dispatch:

jobs:
  respaldar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar si hay base de datos configurada
        id: hay
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: echo "ok=$([ -n "$DB" ] && echo si || echo no)" >> "$GITHUB_OUTPUT"
      - name: Instalar cliente PostgreSQL 17
        if: steps.hay.outputs.ok == 'si'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Exportar datos
        if: steps.hay.outputs.ok == 'si'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --no-owner --no-privileges -Fc -f respaldo-$(date +%F).dump
      - uses: actions/upload-artifact@v4
        if: steps.hay.outputs.ok == 'si'
        with:
          name: respaldo-casa-clara
          path: respaldo-*.dump
          retention-days: 90
